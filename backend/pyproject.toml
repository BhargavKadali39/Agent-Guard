[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-backend"
version = "0.1.0"
description = "AgentGuard backend: AI agent reliability & security demonstration platform (The GenAI Foundry)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "psycopg[binary]==3.3.9",
    "PyJWT==2.15.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",  # required by Starlette's TestClient
    "pytest-cov==7.0.0",
    "ruff==0.17.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "postgres: tests that require a PostgreSQL database (set AGENTGUARD_TEST_POSTGRES_URL)",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app"]
