name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests, SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests migrations
      - run: pytest --cov=app --cov-report=term-missing

  backend-postgres:
    name: Backend (tests, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentguard
          POSTGRES_PASSWORD: agentguard
          POSTGRES_DB: agentguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentguard -d agentguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AGENTGUARD_TEST_DATABASE_URL: postgresql+psycopg://agentguard:agentguard@localhost:5432/agentguard_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Migrations apply cleanly
        run: alembic upgrade head && alembic downgrade base
        env:
          DATABASE_URL: ${{ env.AGENTGUARD_TEST_DATABASE_URL }}
      - run: pytest

  frontend:
    name: Frontend (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DATABASE_URL: sqlite:///./e2e.db
      DEMO_USER_PASSWORD: agentguard-demo
      E2E_DEMO_PASSWORD: agentguard-demo
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -e .
      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm start > ../frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/login > /dev/null && break; sleep 1; done
      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e
      - if: failure()
        run: tail -n 200 backend.log frontend.log
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build
